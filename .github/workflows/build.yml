name: build

# GitHub-hosted runners only: the repository is public, and a self-hosted
# runner would let pull requests run code on the tablet. The kernel is
# cross-compiled (pmb:cross-native) in pmbootstrap's x86_64 native chroot.
# No pull_request trigger on purpose.

on:
  push:
  workflow_dispatch:
    inputs:
      force_build:
        description: Packages to rebuild from source (space-separated)
        default: linux-postmarketos-omap

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/ci/*.sh scripts/runner/*.sh scripts/charger/*.sh
      - run: python3 -m json.tool sources.lock.json > /dev/null

  packages:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kpartx

      - name: Build packages
        env:
          PMOS_SKIP_INSTALL: 1
          PMOS_FORCE_BUILD: ${{ inputs.force_build || 'linux-postmarketos-omap' }}
        run: scripts/ci/build.sh "$RUNNER_TEMP/work" out

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ github.sha }}
          path: out/
          compression-level: 0

  # Publish the packages, so the tablet can fetch them without a token
  # (artifact downloads need one even on a public repository). A separate
  # job so that only it, not the build, holds a write token.
  release:
    needs: packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages-${{ github.sha }}
          path: out

      - name: Publish prerelease packages-<sha>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="packages-${GITHUB_SHA::12}"
          (cd out && sha256sum -c SHA256SUMS)
          gh release create "$tag" out/packages/*.apk out/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "$tag" \
            --notes "Packages built from $GITHUB_SHA by run $GITHUB_RUN_ID. Untested on hardware unless docs/bringup.md says otherwise."
