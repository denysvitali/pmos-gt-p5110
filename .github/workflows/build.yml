name: build

on:
  push:
  workflow_dispatch:
    inputs:
      ui:
        description: pmOS UI package (console, weston, ...)
        default: console
      force_build:
        description: Packages to rebuild from source (space-separated)
        default: linux-postmarketos-omap

jobs:
  lint:
    runs-on: [self-hosted, linux, pmos-gt-p5110]
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/ci/*.sh
      - run: python3 -m json.tool sources.lock.json > /dev/null

  image:
    needs: lint
    runs-on: [self-hosted, linux, pmos-gt-p5110]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        env:
          # Dev images only: set the PMOS_PASSWORD secret before sharing builds.
          PMOS_PASSWORD: ${{ secrets.PMOS_PASSWORD || '147147' }}
          PMOS_UI: ${{ inputs.ui || 'console' }}
          PMOS_FORCE_BUILD: ${{ inputs.force_build || 'linux-postmarketos-omap' }}
        run: scripts/ci/build.sh "$RUNNER_TEMP/work" out

      - uses: actions/upload-artifact@v4
        with:
          name: samsung-espresso10-${{ github.sha }}
          path: out/
          compression-level: 0
