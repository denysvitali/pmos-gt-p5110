name: build

# GitHub-hosted runners only: the repository is public, and a self-hosted
# runner would let pull requests run code on the tablet. The kernel is
# cross-compiled (pmb:cross-native) in pmbootstrap's x86_64 native chroot.
# No pull_request trigger on purpose.

on:
  push:
  workflow_dispatch:
    inputs:
      force_build:
        description: Packages to rebuild from source (space-separated)
        default: linux-postmarketos-omap

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/ci/*.sh scripts/runner/*.sh scripts/charger/*.sh
      - run: python3 -m json.tool sources.lock.json > /dev/null

  packages:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kpartx

      - name: Build packages
        env:
          PMOS_SKIP_INSTALL: 1
          PMOS_FORCE_BUILD: ${{ inputs.force_build || 'linux-postmarketos-omap' }}
        run: scripts/ci/build.sh "$RUNNER_TEMP/work" out

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: out/
          compression-level: 0
